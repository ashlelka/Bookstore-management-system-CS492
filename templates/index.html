{% extends "base.html" %}

{% block body %}

<div class="container">
    <h1>Welcome!</h1>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form id="auth-form" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            class="input-field"
            required
        />

        <input
            type="password"
            name="password"
            placeholder="Password"
            class="input-field"
            required
        />

        <input
            type="text"
            name="first_name"
            placeholder="First Name"
            class="input-field"
        />

        <input
            type="text"
            name="last_name"
            placeholder="Last Name"
            class="input-field"
        />

        <input
            type="button"
            value="Login"
            class="btn btn-login"
            onclick="submitAuth('login')"
        />

        <input
            type="button"
            value="Register"
            class="btn btn-register"
            onclick="submitAuth('register')"
        />

    </form>
</div>

<script>
function submitAuth(action) {

    const form = document.getElementById("auth-form");

    if (action === "login") {

        form.action = "{{ url_for('auth.login') }}";

    } else if (action === "register") {

        form.action = "{{ url_for('auth.register') }}";

    }

    form.method = "POST";
    form.submit();
}
</script>

{% endblock %}
