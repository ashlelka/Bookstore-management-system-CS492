{% extends "base.html" %}

{% block body %}

<div class="container">
    <h1>Welcome!</h1>

    <form id="auth-form" action="{{ url_for('auth.login') }}" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            class="input-field"
/>

        <input
            type="password"
            name="password"
            placeholder="Password"
            class="input-field"
/>

        <input
            type="text"
            name="first_name"
            placeholder="First Name"
            class="input-field"
/>

        <input
            type="text"
            name="last_name"
            placeholder="Last Name"
            class="input-field"
/>

        <input
            type="submit"
            value="Login"
            class="btn btn-login"
            onclick="setActionForm('login')"
        />

        <input
            type="button"
            value="Register"
            class="btn btn-register"
            onclick="setActionForm('register')"
        />

    </form>
</div>

<script>
    function setActionForm(action) {
        let form = document.getElementById("auth-form");

        if (action === "login") {
            form.action = "{{ url_for('auth.login') }}";
            form.method = "POST";
            form.submit();

        } else if (action === "register") {
            form.action = "{{ url_for('auth.register') }}";
            form.method = "POST";
            form.submit();
        }
    }
</script>

{% endblock %}
